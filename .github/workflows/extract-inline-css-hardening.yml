name: Extract inline CSS for CSP hardening

on:
  push:
    branches:
      - security/client-hardening-20260831

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/client-hardening-20260831
      - name: Externalize legacy inline CSS and tighten CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          match = re.search(r'<style>\s*(.*?)\s*</style>', html, flags=re.S)
          if not match:
              raise SystemExit('Expected one inline <style> block, but none was found.')

          if re.search(r'\sstyle\s*=', html, flags=re.I):
              raise SystemExit('Inline style attributes found; refusing to tighten style-src automatically.')

          css = match.group(1).strip() + '\n'
          Path('legacy-inline.css').write_text(css, encoding='utf-8')

          replacement = '  <link rel="stylesheet" href="legacy-inline.css?v=20260831-security">\n'
          html = html[:match.start()] + replacement + html[match.end():]

          old = "style-src 'self' 'unsafe-inline';"
          if old not in html:
              raise SystemExit('Expected style-src unsafe-inline directive was not found.')
          html = html.replace(old, "style-src 'self';", 1)

          old_tail = "form-action 'self'; upgrade-insecure-requests"
          new_tail = "form-action 'self'; frame-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
          if old_tail not in html:
              raise SystemExit('Expected CSP tail was not found.')
          html = html.replace(old_tail, new_tail, 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit hardened client files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html legacy-inline.css
          git commit -m 'Externalize inline CSS and tighten CSP'
          git push origin HEAD:security/client-hardening-20260831
