name: Temporary browser smoke test

on:
  push:
    branches:
      - security/hardening-20260831

permissions:
  contents: write

jobs:
  smoke:
    if: github.event.head_commit.message != 'Verify hardened app in headless browser'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-20260831
      - name: Serve app
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          sleep 1
      - name: Render app in Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on the runner' >&2
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ > /tmp/dom.html
          grep -F 'Мои задачи' /tmp/dom.html
          grep -F 'Поиск по задачам' /tmp/dom.html
      - name: Commit verification marker by removing helper workflow
        if: success()
        run: |
          set -euo pipefail
          rm .github/workflows/security-smoke-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/security-smoke-test.yml
          git commit -m 'Verify hardened app in headless browser'
          git push
