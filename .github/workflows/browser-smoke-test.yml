name: Browser smoke test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud sync logic
        run: |
          node tests/sync.cjs
          node tests/sync-recovery.cjs
          node tests/calendar-cloud-bridge.cjs
      - name: Verify Supabase auth endpoint
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n "s/.*const SUPABASE_URL = '\([^']*\)'.*/\1/p" sync-core.js | head -n1)"
          SUPABASE_KEY="$(sed -n "s/.*const SUPABASE_KEY = '\([^']*\)'.*/\1/p" sync-core.js | head -n1)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          curl --fail --silent --show-error --max-time 15 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/auth/v1/settings" >/dev/null
      - name: Verify Supabase data endpoint
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n "s/.*const SUPABASE_URL = '\([^']*\)'.*/\1/p" sync-core.js | head -n1)"
          SUPABASE_KEY="$(sed -n "s/.*const SUPABASE_KEY = '\([^']*\)'.*/\1/p" sync-core.js | head -n1)"
          STATUS="$(curl --silent --show-error --max-time 15 \
            -o /tmp/supabase-data.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/lawyer_store?select=storage_key&limit=1")"
          case "$STATUS" in
            200|401|403) ;;
            *)
              echo "Unexpected lawyer_store response: HTTP $STATUS" >&2
              cat /tmp/supabase-data.json >&2 || true
              exit 1
              ;;
          esac
      - name: Serve app
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          sleep 1
      - name: Render app in Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on the runner' >&2
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ > /tmp/dom.html
          grep -F 'Сегодня' /tmp/dom.html
          grep -F 'Требуют внимания' /tmp/dom.html
          grep -F 'Сегодня в календаре' /tmp/dom.html
          grep -F 'data-tab="today"' index.html
          grep -F 'workspace-2026.js' index.html
          grep -F 'workspace-pages.js' sync.js
          grep -F 'workspace-task-restore.js' sync.js
          grep -F 'drag-sortable-fix.js?v=20260901-ios-drag-2' sync.js
          grep -F 'workspace-pages.css' app.css
          grep -F 'workspace-polish.css' app.css
          grep -F 'desktop-polish.css' app.css
          grep -F 'interaction-polish.css' app.css
          grep -F 'desktop-ux.js' index.html
          grep -F 'legacy-inline.css' index.html
          grep -F 'maximum-scale=1' index.html
          grep -F 'user-scalable=no' index.html
          grep -F 'Календарь' /tmp/dom.html
      - name: Verify complete workspace redesign in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          if app_tag not in html:
              raise SystemExit('Expected application script tag was not found')
          html = html.replace(app_tag, '<script src="tests/workspace-browser.js"></script>\n' + app_tag, 1)
          Path('workspace-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8765/workspace-test.html > /tmp/workspace.html
          grep -F 'WORKSPACE_PASS' /tmp/workspace.html
          if grep -F 'FAIL:' /tmp/workspace.html; then
            echo 'Workspace browser test reported a failure.' >&2
            exit 1
          fi
      - name: Verify desktop layout and UX in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          if app_tag not in html:
              raise SystemExit('Expected application script tag was not found')
          html = html.replace(app_tag, '<script src="tests/desktop-regression-browser.js"></script>\n' + app_tag, 1)
          Path('desktop-regression-test.html').write_text(html, encoding='utf-8')
          preview = Path('index.html').read_text(encoding='utf-8').replace(app_tag, '<script src="tests/desktop-preview-data.js"></script>\n' + app_tag, 1)
          Path('desktop-preview.html').write_text(preview, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1440,900 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/desktop-regression-test.html > /tmp/desktop-regression.html
          grep -F 'DESKTOP_REGRESSION_PASS' /tmp/desktop-regression.html
          if grep -F 'FAIL:' /tmp/desktop-regression.html; then
            echo 'Desktop regression browser test reported a failure.' >&2
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7000 --screenshot=/tmp/desktop-workspace.png http://127.0.0.1:8765/desktop-preview.html
          test -s /tmp/desktop-workspace.png
      - name: Upload desktop visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-workspace-preview
          path: /tmp/desktop-workspace.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify mobile layout and completed task restore
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          if app_tag not in html:
              raise SystemExit('Expected application script tag was not found')
          html = html.replace(app_tag, '<script src="tests/mobile-regression-browser.js"></script>\n' + app_tag, 1)
          Path('mobile-regression-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/mobile-regression-test.html > /tmp/mobile-regression.html
          grep -F 'MOBILE_REGRESSION_PASS' /tmp/mobile-regression.html
          if grep -F 'FAIL:' /tmp/mobile-regression.html; then
            echo 'Mobile regression browser test reported a failure.' >&2
            exit 1
          fi
      - name: Verify smooth card drag and mobile controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          sync_tag = '<script src="sync.js?v=20260901-ios-drag-2"></script>'
          if app_tag not in html or sync_tag not in html:
              raise SystemExit('Expected application script tags were not found')
          html = html.replace(app_tag, '<script src="tests/interaction-regression-browser.js"></script>\n' + app_tag, 1)
          html = html.replace(sync_tag, '<script src="drag-sortable-fix.js?v=ci"></script>\n<script src="project-lifecycle.js?v=ci"></script>\n<script src="workspace-pages.js?v=ci"></script>\n<script src="workspace-task-restore.js?v=ci"></script>', 1)
          Path('interaction-regression-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/interaction-regression-test.html > /tmp/interaction-regression.html
          grep -F 'INTERACTION_REGRESSION_PASS' /tmp/interaction-regression.html
          if grep -F 'FAIL:' /tmp/interaction-regression.html; then
            echo 'Interaction regression browser test reported a failure.' >&2
            exit 1
          fi
      - name: Verify project completion lifecycle in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          sync_tag = '<script src="sync.js?v=20260901-ios-drag-2"></script>'
          if app_tag not in html or sync_tag not in html:
              raise SystemExit('Expected application script tags were not found')
          html = html.replace(app_tag, '<script src="tests/project-lifecycle-browser.js"></script>\n' + app_tag, 1)
          html = html.replace(sync_tag, '<script src="project-lifecycle.js?v=ci"></script>\n<script src="workspace-pages.js?v=ci"></script>\n<script src="workspace-task-restore.js?v=ci"></script>', 1)
          Path('project-lifecycle-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8765/project-lifecycle-test.html > /tmp/project-lifecycle.html
          grep -F 'PROJECT_LIFECYCLE_PASS' /tmp/project-lifecycle.html
          if grep -F 'FAIL:' /tmp/project-lifecycle.html; then
            echo 'Project lifecycle browser test reported a failure.' >&2
            exit 1
          fi
      - name: Verify monthly calendar in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          html = html.replace(app_tag, '<script src="tests/calendar-browser.js"></script>\n' + app_tag, 1)
          Path('calendar-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8765/calendar-test.html > /tmp/calendar.html
          grep -F 'CALENDAR_PASS' /tmp/calendar.html
          if grep -F 'FAIL:' /tmp/calendar.html; then
            echo 'Calendar browser test reported a failure.' >&2
            exit 1
          fi