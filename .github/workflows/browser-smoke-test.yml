name: Browser smoke test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Serve app
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          sleep 1
      - name: Render app in Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on the runner' >&2
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ > /tmp/dom.html
          grep -F 'Мои задачи' /tmp/dom.html
          grep -F 'Поиск по задачам' /tmp/dom.html
          grep -F 'app-core.js' index.html
          grep -F 'legacy-inline.css' index.html
          grep -F 'Календарь' /tmp/dom.html
      - name: Verify project completion lifecycle in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          sync_tag = '<script src="sync.js?v=20260831-calendar"></script>'
          if app_tag not in html or sync_tag not in html:
              raise SystemExit('Expected application script tags were not found')
          html = html.replace(app_tag, '<script src="tests/project-lifecycle-browser.js"></script>\n' + app_tag, 1)
          html = html.replace(sync_tag, '<script src="project-lifecycle.js?v=ci"></script>\n<script src="dashboard-stats.js?v=ci"></script>', 1)
          Path('project-lifecycle-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/project-lifecycle-test.html > /tmp/project-lifecycle.html
          grep -F 'PROJECT_LIFECYCLE_PASS' /tmp/project-lifecycle.html
          if grep -F 'FAIL:' /tmp/project-lifecycle.html; then
            echo 'Project lifecycle browser test reported a failure.' >&2
            exit 1
          fi
      - name: Verify weekly calendar in Chrome
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          app_tag = '<script src="app-core.js?v=20260831-calendar"></script>'
          html = html.replace(app_tag, '<script src="tests/calendar-browser.js"></script>\n' + app_tag, 1)
          Path('calendar-test.html').write_text(html, encoding='utf-8')
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8765/calendar-test.html > /tmp/calendar.html
          grep -F 'CALENDAR_PASS' /tmp/calendar.html
          if grep -F 'FAIL:' /tmp/calendar.html; then
            echo 'Calendar browser test reported a failure.' >&2
            exit 1
          fi
