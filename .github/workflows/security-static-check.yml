name: Static security checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject server-side Supabase secrets in application source
        run: |
          set -euo pipefail
          files=(index.html app-core.js theme-init.js sync.js sync-core.js qwen-enhancements.js dashboard-stats.js)
          present=()
          for file in "${files[@]}"; do
            [ -f "$file" ] && present+=("$file")
          done
          if grep -InE '(sb_secret_|SUPABASE_SERVICE_ROLE|service_role_key|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "${present[@]}"; then
            echo 'Potential server-side secret/private key found in application source.' >&2
            exit 1
          fi
      - name: Require strict script CSP
        run: |
          set -euo pipefail
          grep -F "script-src 'self'" index.html
          if grep -F "script-src 'self' 'unsafe-inline'" index.html; then
            echo "script-src must not allow unsafe-inline" >&2
            exit 1
          fi
      - name: Reject dynamic code execution primitives
        run: |
          set -euo pipefail
          files=(index.html app-core.js theme-init.js sync.js sync-core.js qwen-enhancements.js dashboard-stats.js)
          present=()
          for file in "${files[@]}"; do
            [ -f "$file" ] && present+=("$file")
          done
          if grep -InE '(^|[^A-Za-z])(eval\s*\(|new[[:space:]]+Function\s*\()' "${present[@]}"; then
            echo 'Dynamic code execution primitive found.' >&2
            exit 1
          fi
      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
