name: Static security checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject server-side Supabase secrets in application source
        run: |
          set -euo pipefail
          files=(index.html app-core.js calendar-core.js calendar-cloud-bridge.js workspace-2026.js workspace-pages.js theme-init.js sync.js sync-core.js qwen-enhancements.js dashboard-stats.js project-lifecycle.js drag-sortable-fix.js)
          present=()
          for file in "${files[@]}"; do
            [ -f "$file" ] && present+=("$file")
          done
          if grep -InE '(sb_secret_|SUPABASE_SERVICE_ROLE|service_role_key|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "${present[@]}"; then
            echo 'Potential server-side secret/private key found in application source.' >&2
            exit 1
          fi
      - name: Require strict script CSP
        run: |
          set -euo pipefail
          grep -F "script-src 'self'" index.html
          if grep -E "script-src[^;]*'unsafe-inline'" index.html; then
            echo "script-src must not allow unsafe-inline" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          if re.search(r'<script\b[^>]*\bsrc=["\']https?://', html, flags=re.I):
              raise SystemExit('Third-party executable JavaScript is not allowed.')
          PY
      - name: Require strict style CSP
        run: |
          set -euo pipefail
          grep -F "style-src 'self'" index.html
          if grep -E "style-src[^;]*'unsafe-inline'" index.html; then
            echo "style-src must not allow unsafe-inline" >&2
            exit 1
          fi
          if grep -Eqi '<style([[:space:]>])' index.html; then
            echo 'Inline style blocks are not allowed.' >&2
            exit 1
          fi
          if grep -Eqi '[[:space:]]style[[:space:]]*=' index.html; then
            echo 'Inline style attributes are not allowed.' >&2
            exit 1
          fi
      - name: Reject dynamic code execution primitives
        run: |
          set -euo pipefail
          files=(index.html app-core.js calendar-core.js calendar-cloud-bridge.js workspace-2026.js workspace-pages.js theme-init.js sync.js sync-core.js qwen-enhancements.js dashboard-stats.js project-lifecycle.js drag-sortable-fix.js)
          present=()
          for file in "${files[@]}"; do
            [ -f "$file" ] && present+=("$file")
          done
          if grep -InE '(^|[^A-Za-z])(eval\s*\(|new[[:space:]]+Function\s*\()' "${present[@]}"; then
            echo 'Dynamic code execution primitive found.' >&2
            exit 1
          fi
      - name: Verify lawyer_store RLS contract
        run: |
          set -euo pipefail
          migration='supabase/migrations/20260831_harden_lawyer_store_rls.sql'
          test -f "$migration"
          grep -Fi 'enable row level security' "$migration"
          grep -Fi 'force row level security' "$migration"
          grep -Fi 'revoke all on table public.lawyer_store from anon' "$migration"
          grep -Fi 'grant select, insert, update on table public.lawyer_store to authenticated' "$migration"
          grep -Fi "tablename = 'lawyer_store'" "$migration"
          test "$(grep -Fic '(select auth.uid()) = user_id' "$migration")" -ge 4
          if grep -Fi 'grant select, insert, update, delete' "$migration"; then
            echo 'DELETE privilege is not required by the tracker.' >&2
            exit 1
          fi
      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)