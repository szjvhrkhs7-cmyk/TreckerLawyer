name: Temporary Supabase access audit

on:
  push:
    branches:
      - security/hardening-20260831

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check anonymous access without exposing data
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cfkpxrvinkcutbtqpufa.supabase.co'
          KEY='sb_publishable_VAKzxSJ53hXxd4Tvk0FFlw_D_sNbFq9'

          echo 'Testing anonymous SELECT visibility...'
          select_status=$(curl -sS -o /tmp/select-body -D /tmp/select-headers -w '%{http_code}' \
            -H "apikey: ${KEY}" \
            -H 'Prefer: count=exact' \
            "${URL}/rest/v1/lawyer_store?select=storage_key&limit=1")
          content_range=$(grep -i '^content-range:' /tmp/select-headers | tr -d '\r' | cut -d' ' -f2- || true)
          echo "SELECT_HTTP_STATUS=${select_status}"
          echo "SELECT_CONTENT_RANGE=${content_range:-not-returned}"

          visible_count='unknown'
          if [[ "$content_range" =~ /([0-9]+)$ ]]; then
            visible_count="${BASH_REMATCH[1]}"
          fi
          echo "ANON_VISIBLE_ROW_COUNT=${visible_count}"

          if [[ "$select_status" == '200' && "$visible_count" != 'unknown' && "$visible_count" -gt 0 ]]; then
            echo 'SECURITY_RESULT=FAIL: anonymous role can see one or more lawyer_store rows.'
            exit 1
          fi

          echo 'Testing anonymous empty INSERT capability (no row is created)...'
          insert_status=$(curl -sS -o /tmp/insert-body -w '%{http_code}' \
            -X POST \
            -H "apikey: ${KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: return=minimal' \
            --data '[]' \
            "${URL}/rest/v1/lawyer_store")
          echo "EMPTY_INSERT_HTTP_STATUS=${insert_status}"

          if [[ "$select_status" == '401' || "$select_status" == '403' ]]; then
            echo 'SELECT_RESULT=strongly blocked for anonymous role.'
          elif [[ "$select_status" == '200' && "$visible_count" == '0' ]]; then
            echo 'SELECT_RESULT=no rows visible to anonymous role; consistent with effective RLS.'
          else
            echo 'SELECT_RESULT=inconclusive; inspect headers/status above.'
          fi

          if [[ "$insert_status" == '401' || "$insert_status" == '403' ]]; then
            echo 'INSERT_RESULT=blocked for anonymous role.'
          else
            echo 'INSERT_RESULT=endpoint accepted an empty request; this alone does not prove a real row can be inserted.'
          fi
