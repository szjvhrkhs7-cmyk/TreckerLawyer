name: Patch Merriweather CSP

on:
  push:
    branches:
      - design/merriweather-brandmark-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/merriweather-brandmark-20260831
          fetch-depth: 0
      - name: Update CSP font source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "font-src 'self';"
          new = "font-src 'self' https://raw.githubusercontent.com;"
          if old not in text:
              raise SystemExit('Expected CSP fragment not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit the patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/patch-merriweather-csp.yml
          git commit -m "Allow official Merriweather webfonts in CSP"
          git push origin HEAD:design/merriweather-brandmark-20260831
