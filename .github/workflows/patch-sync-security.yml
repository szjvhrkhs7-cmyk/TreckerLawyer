name: Patch sync security defaults

on:
  push:
    branches:
      - security/hardening-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Harden Supabase requests and signup password policy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hardening-20260831
      - name: Patch sync-core.js
        shell: python
        run: |
          from pathlib import Path
          p = Path('sync-core.js')
          s = p.read_text(encoding='utf-8')

          old_auth = """    const response = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {\n      ...requestOptions,\n      headers: { ...authHeaders(token), ...(headers || {}) }\n    });"""
          new_auth = """    const response = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {\n      ...requestOptions,\n      cache: 'no-store',\n      credentials: 'omit',\n      redirect: 'error',\n      referrerPolicy: 'no-referrer',\n      headers: { ...authHeaders(token), ...(headers || {}) }\n    });"""
          if old_auth not in s:
              raise SystemExit('authRequest pattern not found')
          s = s.replace(old_auth, new_auth, 1)

          old_data = """    const response = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {\n      ...options,\n      headers: { ...authHeaders(session.access_token), ...(options.headers || {}) }\n    });"""
          new_data = """    const response = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {\n      ...options,\n      cache: 'no-store',\n      credentials: 'omit',\n      redirect: 'error',\n      referrerPolicy: 'no-referrer',\n      headers: { ...authHeaders(session.access_token), ...(options.headers || {}) }\n    });"""
          if old_data not in s:
              raise SystemExit('dataRequest pattern not found')
          s = s.replace(old_data, new_data, 1)

          old_password = """    const password = String(data.get('password') || '');\n    setFormBusy(form, true);"""
          new_password = """    const password = String(data.get('password') || '');\n    if (createAccount && password.length < 12) {\n      renderSyncPanel('Для нового аккаунта используйте пароль не короче 12 символов.', 'error');\n      return;\n    }\n    setFormBusy(form, true);"""
          if old_password not in s:
              raise SystemExit('signup password pattern not found')
          s = s.replace(old_password, new_password, 1)

          s = s.replace(
              "if (message.includes('password')) return 'Проверьте пароль, он должен содержать не менее 6 символов';",
              "if (message.includes('password')) return 'Проверьте пароль. Для нового аккаунта используйте не менее 12 символов.';",
              1,
          )
          p.write_text(s, encoding='utf-8')
      - name: Syntax check
        run: node --check sync-core.js
      - name: Commit patch and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/patch-sync-security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync-core.js .github/workflows/patch-sync-security.yml
          git commit -m 'Harden Supabase requests and signup password policy'
          git push
