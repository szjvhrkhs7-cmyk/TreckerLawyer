name: Apply Qwen merge

on:
  push:
    branches:
      - merge/qwen-20260831
    paths:
      - .github/workflows/apply-qwen-merge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Qwen changes onto current tracker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge/qwen-20260831
          fetch-depth: 0

      - name: Port Qwen changes safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Preserve current Supabase connectivity and hardening, while allowing the pinned DOMPurify CDN.
          csp = "  <meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; connect-src 'self' https://cfkpxrvinkcutbtqpufa.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests\">"
          text, count = re.subn(r'^  <meta http-equiv="Content-Security-Policy"[^\n]*$', csp, text, count=1, flags=re.M)
          assert count == 1, 'CSP meta not found'

          dompurify = '  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js" integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb" crossorigin="anonymous"></script>'
          manifest = '  <link rel="manifest" href="manifest.webmanifest?v=20260827-blue-icon">'
          assert manifest in text, 'manifest link not found'
          if dompurify not in text:
              text = text.replace(manifest, manifest + '\n' + dompurify, 1)

          old_prefix = 'function sanitizeNoteHtml(value){const source='
          new_prefix = "function sanitizeNoteHtml(value){if(typeof DOMPurify!=='undefined'){return DOMPurify.sanitize(String(value||''),{ALLOWED_TAGS:['b','strong','ul','ol','li','br','p','div'],ALLOWED_ATTR:[]})}const source="
          assert old_prefix in text, 'sanitizer function not found'
          text = text.replace(old_prefix, new_prefix, 1)

          render_pattern = r'(function render\(\)\{[^\n]*\}\n)'
          notification_code = """function checkOverdueAndNotify(){if(!('Notification' in window)||Notification.permission!=='granted')return;const ts=load(LS.tasks).filter(valid).map(normTask).filter(t=>overdue(t)&&t.status!=='done');const signature=ts.map(t=>String(t.id)).sort().join('|');if(ts.length&&signature!==checkOverdueAndNotify.lastSignature){new Notification('Трекер юриста',{body:`${ts.length} просроченных задач требуют внимания`,icon:'tracker-icon-blue-192.png',badge:'tracker-icon-blue-192.png'});checkOverdueAndNotify.lastSignature=signature}else if(!ts.length){checkOverdueAndNotify.lastSignature=''}}
function requestNotificationPermission(){if('Notification' in window&&Notification.permission==='default'){const result=Notification.requestPermission();result?.catch?.(()=>{})}}
"""
          text, count = re.subn(render_pattern, lambda m: m.group(1) + notification_code, text, count=1)
          assert count == 1, 'render function not found'

          backup_fn = "function backup(){const ts=new Date().toISOString().slice(0,19).replace(/:/g,'-');download(`lawyer-backup-${ts}.json`,JSON.stringify({version:7,backupDate:now(),tasks:load(LS.tasks),projects:load(LS.projects),projectTasks:load(LS.projectTasks),notes:load(LS.notes),taskOrder:load(LS.taskOrder),projectTaskOrder:load(LS.projectTaskOrder),projectOrder:load(LS.projectOrder),noteOrder:load(LS.noteOrder)},null,2),'application/json')}\n"
          text, count = re.subn(r'function backup\(\)\{[^\n]*\}\n', backup_fn, text, count=1)
          assert count == 1, 'backup function not found'

          restore_fn = """function restore(file){if(!file)return;const MAX_SIZE=5*1024*1024;if(file.size>MAX_SIZE){alert('Файл слишком большой. Максимальный размер 5 МБ');return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d)){throw new Error('Неверный формат файла')}if(d.version&&Number(d.version)>7){alert('Файл создан более новой версией приложения. Обновите приложение.');return}const entityKeys=['tasks','projects','projectTasks','notes'],orderKeys=['taskOrder','projectTaskOrder','projectOrder','noteOrder'];for(const k of entityKeys){if(d[k]===undefined)continue;if(!Array.isArray(d[k]))throw new Error(`Поле ${k} имеет неверный формат`);if(d[k].length>10000)throw new Error(`Слишком много записей в ${k}`);save(LS[k],d[k].filter(item=>item&&typeof item==='object'&&!Array.isArray(item)&&valid(item)))}for(const k of orderKeys){if(d[k]===undefined)continue;if(!Array.isArray(d[k]))throw new Error(`Поле ${k} имеет неверный формат`);if(d[k].length>10000)throw new Error(`Слишком много записей в ${k}`);save(LS[k],d[k].filter(id=>typeof id==='string'||typeof id==='number').map(String))}render();alert('Данные успешно восстановлены')}catch(e){console.error('backup restore error',e);alert('Не удалось прочитать файл резервной копии. Проверьте его формат и целостность.')}};r.readAsText(file)}
"""
          text, count = re.subn(r'function restore\(file\)\{[^\n]*\}\n', restore_fn, text, count=1)
          assert count == 1, 'restore function not found'

          tail = "applyTheme(document.documentElement.dataset.theme);\nrender();\n</script>"
          replacement = "applyTheme(document.documentElement.dataset.theme);\nrender();\ndocument.addEventListener('pointerdown',requestNotificationPermission,{once:true,passive:true});\nsetInterval(checkOverdueAndNotify,300000);\nsetTimeout(checkOverdueAndNotify,1500);\n</script>"
          assert tail in text, 'script tail not found'
          text = text.replace(tail, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S | re.I):
              if 'src=' not in attrs.lower():
                  blocks.append(body)
          Path('/tmp/tracker-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          assert 'DOMPurify.sanitize' in html
          assert 'MAX_SIZE=5*1024*1024' in html
          assert 'checkOverdueAndNotify' in html
          assert 'https://cfkpxrvinkcutbtqpufa.supabase.co' in html
          assert 'Iowan Old Style' in html
          assert 'tracker-icon-blue-192.png' in html
          PY
          node --check /tmp/tracker-inline.js
          git diff --check

      - name: Commit merged version
        shell: bash
        run: |
          rm -f .github/workflows/apply-qwen-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .gitignore .github/workflows/apply-qwen-merge.yml
          git commit -m "Merge Qwen security and backup improvements"
          git push origin HEAD:merge/qwen-20260831
