function openTask(t={}){state.editingTask=t;taskSheetTitle.textContent=t.id?'Редактирование задачи':'Новая задача';taskForm.innerHTML=`<div class="field"><label>Краткая суть задачи *</label><textarea name="title" required>${esc(t.title||'')}</textarea></div><div class="field"><label>Что требуется дополнительно</label><textarea name="extra">${esc(t.extra||'')}</textarea></div><div class="grid2"><div class="field"><label>Дата ответа</label><input type="date" name="dueDate" value="${esc(t.dueDate||'')}"></div><div class="field"><label>Напоминание</label><select name="reminder"><option value="0">Нет</option><option value="1">За 1 день</option><option value="2">За 2 дня</option><option value="3">За 3 дня</option><option value="7">За неделю</option></select></div></div><div class="grid2"><div class="field"><label>Категория срочности</label><select name="priority"><option value="normal">Обычная</option><option value="low">Низкая</option><option value="medium">Средняя</option><option value="high">Важно / срочно</option></select></div><div class="field"><label>Статус</label><select name="status"><option value="new">Новая</option><option value="inwork">В работе</option><option value="waiting">Ожидание</option><option value="done">Завершена</option></select></div></div><div class="field"><label>Заметки</label><textarea name="notes" data-autogrow="true">${esc(stripHtml(t.notes||''))}</textarea></div><div class="sheet-actions"><button type="button" class="btn" id="cancelTask">Отмена</button><button class="btn primary">Сохранить</button></div>`;taskForm.reminder.value=t.reminder??0;taskForm.priority.value=t.priority||'normal';taskForm.status.value=t.status||'new';showOverlay(taskSheet);bindAutoGrow(taskForm)}
function saveTaskForm(e){e.preventDefault();const f=new FormData(taskForm),arr=tasks(),old=state.editingTask?.id&&arr.find(x=>sameId(x.id,state.editingTask.id)),title=(f.get('title')||'').trim();if(!title){const control=taskForm.elements.namedItem('title');control.setCustomValidity('Укажите краткую суть задачи');control.reportValidity();control.setCustomValidity('');return}const obj={...(old||{}),id:old?.id||uid(),projectId:state.projectId||old?.projectId,title,extra:(f.get('extra')||'').trim(),dueDate:f.get('dueDate'),reminder:+f.get('reminder')||0,priority:f.get('priority'),status:f.get('status'),notes:f.get('notes')||'',createdAt:old?.createdAt||now(),updatedAt:now()};old?arr.splice(arr.indexOf(old),1,obj):arr.push(obj);putTasks(arr);hideOverlay(taskSheet);render()}
function openProject(p={}){state.editingProject=p;projectSheetTitle.textContent=p.id?'Редактирование проекта':'Новый проект';projectForm.innerHTML=`<div class="field"><label>Название проекта *</label><input name="title" required value="${esc(p.title||'')}"></div><div class="field"><label>Описание</label><textarea name="description">${esc(p.description||'')}</textarea></div><div class="sheet-actions"><button type="button" class="btn" id="cancelProject">Отмена</button><button class="btn primary">Сохранить</button></div>`;showOverlay(projectSheet);bindAutoGrow(projectForm)}
function saveProjectForm(e){e.preventDefault();const f=new FormData(projectForm),arr=allProjects(),old=state.editingProject?.id&&arr.find(x=>sameId(x.id,state.editingProject.id)),title=(f.get('title')||'').trim();if(!title){const control=projectForm.elements.namedItem('title');control.setCustomValidity('Укажите название проекта');control.reportValidity();control.setCustomValidity('');return}const obj={...(old||{}),id:old?.id||uid(),title,description:(f.get('description')||'').trim(),createdAt:old?.createdAt||now(),updatedAt:now()};old?arr.splice(arr.indexOf(old),1,obj):arr.push(obj);save(LS.projects,arr);hideOverlay(projectSheet);render()}
function openNote(n={}){state.editingNote=n;noteSheetTitle.textContent=n.id?'Редактирование заметки':'Новая заметка';noteForm.innerHTML=`<div class="field"><label>Заголовок</label><input name="title" value="${esc(n.title||'')}"></div><div class="field"><label>Текст</label><div class="editor-wrap"><div class="editor-toolbar" role="toolbar" aria-label="Форматирование текста"><button type="button" class="editor-btn bold" data-note-command="bold" aria-label="Полужирный текст">B</button><button type="button" class="editor-btn" data-note-command="insertUnorderedList" aria-label="Маркированный список">• Список</button><button type="button" class="editor-btn" data-note-command="undo" aria-label="Отменить последнее изменение">↶ Отменить</button></div><div id="noteBodyEditor" class="note-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Введите текст заметки"></div></div></div><div class="sheet-actions"><button type="button" class="btn" id="cancelNote">Отмена</button><button class="btn primary">Сохранить</button></div>`;const editor=$('#noteBodyEditor');editor.innerHTML=noteBodyToHtml(n.body||'');noteForm.querySelectorAll('[data-note-command]').forEach(button=>{button.addEventListener('pointerdown',e=>e.preventDefault());button.addEventListener('click',()=>{editor.focus();document.execCommand(button.dataset.noteCommand,false,null)})});showOverlay(noteSheet)}
function saveNoteForm(e){e.preventDefault();const f=new FormData(noteForm),arr=allNotes(),old=state.editingNote?.id&&arr.find(x=>sameId(x.id,state.editingNote.id)),editor=$('#noteBodyEditor');let body=sanitizeNoteHtml(editor?.innerHTML||'');if(!stripHtml(body).trim())body='';const obj={...(old||{}),id:old?.id||uid(),title:(f.get('title')||'').trim(),body,attachments:old?.attachments||[],createdAt:old?.createdAt||now(),updatedAt:now()};old?arr.splice(arr.indexOf(old),1,obj):arr.push(obj);save(LS.notes,arr);hideOverlay(noteSheet);render()}
function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function csvSafe(v){v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){const rows=[['title','extra','dueDate','reminder','priority','status'],...load(LS.tasks).filter(valid).map(normTask).map(t=>[t.title,t.extra,t.dueDate,t.reminder,t.priority,t.status])];download('tasks.csv',rows.map(r=>r.map(csvSafe).join(',')).join('\n'),'text/csv')}
function backup(){download('lawyer-backup.json',JSON.stringify({version:7,tasks:load(LS.tasks),projects:load(LS.projects),projectTasks:load(LS.projectTasks),notes:load(LS.notes),taskOrder:load(LS.taskOrder),projectTaskOrder:load(LS.projectTaskOrder),projectOrder:load(LS.projectOrder),noteOrder:load(LS.noteOrder)},null,2),'application/json')}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);['tasks','projects','projectTasks','notes','taskOrder','projectTaskOrder','projectOrder','noteOrder'].forEach(k=>Array.isArray(d[k])&&save(LS[k],d[k]));render()}catch{alert('Не удалось прочитать файл резервной копии')}};r.readAsText(file)}
function icsSafe(v){return String(v??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1')}
function makeIcs(t){const dt=(t?.dueDate||new Date().toISOString().slice(0,10)).replaceAll('-','');download('task.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lawyer Tracker//RU\r\nBEGIN:VEVENT\r\nUID:${icsSafe(t?.id||uid())}\r\nSUMMARY:${icsSafe(t?.title||'Задача')}\r\nDTSTART;VALUE=DATE:${dt}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`,'text/calendar;charset=utf-8')}
function switchTab(tab){state={...state,tab,query:'',projectId:null,filter:'active',showCompleted:false};render()}
tabs.onclick=e=>{const b=e.target.closest('.tab');if(b)switchTab(b.dataset.tab)};
backBtn.onclick=()=>{state.projectId=null;state.filter='active';state.query='';state.showCompleted=false;render()};
fab.onclick=()=>state.tab==='projects'&&!state.projectId?openProject():state.tab==='notes'&&!state.projectId?openNote():openTask();
page.onclick=e=>{
  if(e.target.closest('[data-drag-handle]'))return;
  let id;
  if(e.target.dataset.filter){state.filter=e.target.dataset.filter;state.showCompleted=false;render()}
  if(e.target.id==='toggleCompleted'){state.showCompleted=!state.showCompleted;render()}
  id=e.target.dataset.editTask;if(id)openTask(tasks().find(t=>sameId(t.id,id)));
  id=e.target.dataset.doneTask;if(id){const arr=tasks(),t=arr.find(x=>sameId(x.id,id));if(t){t.status='done';t.updatedAt=now();putTasks(arr);render()}}
  id=e.target.dataset.delTask;if(id){const taskId=id;askConfirm('Задача будет удалена без возможности восстановления.',()=>{putTasks(tasks().filter(t=>!sameId(t.id,taskId)));render()})}
  id=e.target.dataset.icsTask;if(id)makeIcs(tasks().find(t=>sameId(t.id,id)));
  id=e.target.closest('[data-open-project]')?.dataset.openProject;if(id){state.projectId=id;state.filter='active';state.query='';state.showCompleted=false;render()}
  id=e.target.dataset.editProject;if(id)openProject(allProjects().find(p=>sameId(p.id,id)));
  id=e.target.dataset.delProject;if(id){const projectId=id;askConfirm('Проект и все его задачи будут удалены без возможности восстановления.',()=>{save(LS.projects,allProjects().filter(p=>!sameId(p.id,projectId)));save(LS.projectTasks,load(LS.projectTasks).filter(t=>!sameId(t.projectId,projectId)));render()})}
  id=e.target.dataset.deleteNote;if(id){e.stopPropagation();deleteNote(id);return}
  id=e.target.closest('[data-open-note]')?.dataset.openNote;if(id&&!e.target.closest('.swipe-action'))openNote(allNotes().find(n=>sameId(n.id,id)));
  if(e.target.id==='csvBtn')exportCsv();if(e.target.id==='backupBtn')backup();if(e.target.id==='restoreBtn')restoreInput.click();
};
undoDelete.onclick=undoNoteDelete;
themeToggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);
confirmCancel.onclick=()=>{confirmAction=null;hideOverlay(confirmDialog)};
confirmAccept.onclick=()=>{const action=confirmAction;confirmAction=null;hideOverlay(confirmDialog);action?.()};
taskForm.onsubmit=saveTaskForm;projectForm.onsubmit=saveProjectForm;noteForm.onsubmit=saveNoteForm;restoreInput.onchange=()=>restore(restoreInput.files[0]);
document.addEventListener('click',e=>{if(e.target.id==='cancelTask')hideOverlay(taskSheet);if(e.target.id==='cancelProject')hideOverlay(projectSheet);if(e.target.id==='cancelNote')hideOverlay(noteSheet);if(e.target.classList.contains('overlay')){if(e.target===confirmDialog)confirmAction=null;hideOverlay(e.target)}});
document.addEventListener('keydown',e=>{const open=document.querySelector('.overlay.show');if(e.key==='Escape'&&open){if(open===confirmDialog)confirmAction=null;hideOverlay(open);return}if(e.key==='Tab'&&open){const focusable=[...open.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[contenteditable="true"],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-note]')){e.preventDefault();openNote(allNotes().find(n=>sameId(n.id,e.target.dataset.openNote)))}});
const systemTheme=matchMedia('(prefers-color-scheme: dark)');systemTheme.addEventListener?.('change',event=>{let saved=null;try{saved=localStorage.getItem(THEME_KEY)}catch{}if(!saved)applyTheme(event.matches?'dark':'light')});
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}
applyTheme(document.documentElement.dataset.theme);
render();
</script>
