.field{display:grid;gap:8px}.field label{font-size:13px;font-weight:800;color:var(--muted)}.field input,.field textarea,.field select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;color:var(--text);padding:13px 14px;outline:none;-webkit-appearance:none}.field textarea{min-height:96px;resize:none;line-height:1.45;overflow:hidden}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}@media(max-width:390px){.top,.page{padding-left:14px;padding-right:14px}.grid2{grid-template-columns:1fr}.tab{font-size:14px}.btn{font-size:13px;padding:0 11px}.fab{right:16px;width:58px;height:58px}.swipe-action{width:88px}}

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 2.7 2.7L16.5 9"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.8A8 8 0 0 1 9.2 3.5 8.5 8.5 0 1 0 20.5 14.8Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 5h16l2 10v4H2v-4Z"/><path d="M2 15h6l2 2h4l2-2h6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .7-7.94A6 6 0 0 0 6.35 8.3 4.8 4.8 0 0 0 7 18Z"/><path d="m9.5 14 2.5-2.5 2.5 2.5M12 11.5V17"/></symbol>
  </svg>
  <main class="app">
    <header class="top">
      <div class="brandbar">
        <div class="brandmark" aria-hidden="true"><svg class="icon"><use href="#i-check-square"></use></svg></div>
        <p class="brandname">Трекер юриста<span>Личное рабочее пространство</span></p>
        <button class="sync-button" id="syncButton" type="button" aria-label="Настроить синхронизацию" title="Синхронизация данных">
          <svg class="icon" aria-hidden="true"><use href="#i-cloud"></use></svg>
          <span id="syncButtonText">Локально</span>
        </button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить цветовую тему" title="Переключить тему">
          <svg class="icon sun" aria-hidden="true"><use href="#i-sun"></use></svg>
          <svg class="icon moon" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
      </div>
      <div id="navline" class="navline hidden"><button class="back" id="backBtn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Назад</button><h1 class="title" id="contextTitle"></h1></div>
      <h1 id="mainTitle" class="title">Рабочее пространство</h1>
      <p class="stats" id="stats"></p>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы приложения">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="tasks"><svg class="icon" aria-hidden="true"><use href="#i-tasks"></use></svg>Задачи <span class="count" id="tasksCount">0</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="projects"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>Проекты <span class="count" id="projectsCount">0</span></button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="notes"><svg class="icon" aria-hidden="true"><use href="#i-note"></use></svg>Заметки <span class="count" id="notesCount">0</span></button>
      </nav>
    </header>
    <section class="page" id="page"></section>
  </main>
  <button class="fab" id="fab" type="button" aria-label="Добавить"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
  <section class="overlay" id="taskSheet" role="dialog" aria-modal="true" aria-labelledby="taskSheetTitle" aria-hidden="true"><div class="sheet"><div class="grab"></div><h2 id="taskSheetTitle">Задача</h2><form id="taskForm" class="form"></form></div></section>
  <section class="overlay" id="projectSheet" role="dialog" aria-modal="true" aria-labelledby="projectSheetTitle" aria-hidden="true"><div class="sheet"><div class="grab"></div><h2 id="projectSheetTitle">Проект</h2><form id="projectForm" class="form"></form></div></section>
  <section class="overlay" id="noteSheet" role="dialog" aria-modal="true" aria-labelledby="noteSheetTitle" aria-hidden="true"><div class="sheet"><div class="grab"></div><h2 id="noteSheetTitle">Заметка</h2><form id="noteForm" class="form"></form></div></section>
  <section class="overlay" id="syncSheet" role="dialog" aria-modal="true" aria-labelledby="syncSheetTitle" aria-hidden="true"><div class="sheet sync-sheet"><div class="grab"></div><h2 id="syncSheetTitle">Синхронизация</h2><div id="syncContent"></div></div></section>
  <section class="overlay" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage" aria-hidden="true">
    <div class="confirm-box">
      <h2 id="confirmTitle">Подтвердите действие</h2>
      <p id="confirmMessage"></p>
      <div class="confirm-actions"><button class="btn" id="confirmCancel" type="button">Отмена</button><button class="btn danger" id="confirmAccept" type="button">Удалить</button></div>
    </div>
  </section>
  <div class="undo-toast" id="undoToast" role="status" aria-live="polite"><span>Заметка удалена</span><button id="undoDelete" type="button">Отменить</button></div>
  <input id="restoreInput" type="file" accept="application/json" hidden>
<script src="app-core.js?v=20260831-security"></script>
